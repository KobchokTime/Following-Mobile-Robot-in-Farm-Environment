# slam_toolbox params for slam_mapping_only.sh (no wheel odometry).
# Based on slam_params_1115.yaml (2026-11-15 working joystick map). Changes, all because
# odom->base_link is a fixed identity and the pose comes from scan matching alone:
#   minimum_travel_distance/heading 0.5 -> 0.0: identity odom never 'travels', so with
#     non-zero values only the first scan would ever be added and /map would never grow;
#     scans are now added by time (minimum_time_interval).
#   minimum_time_interval 0.5 -> 0.1 and coarse_search_angle_offset 0.349 -> 0.524 (30 deg):
#     bag replay 2026-11-15 (slam_live_viewer/bag_replay_1): heading error vs scan geometry
#     27.1 deg with 0.3 / 0.349, 3.7 deg with 0.1 / 0.524 (position error 0.09 / 0.12 m).
#   correlation_search_space_dimension 0.5 -> 0.8: wider search, no odometry prediction.
#   map_update_interval 5.0 -> 2.0: /map refresh for the live viewer.
slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 2.0
    resolution: 0.05
    max_laser_range: 12.0
    minimum_time_interval: 0.1
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.0
    minimum_travel_heading: 0.0
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    correlation_search_space_dimension: 0.8
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.524
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
